name: Packaging lint (Windows only)

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-packaging:
    name: Windows packaging checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem packaging/windows/*.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.Name): $_" }
              exit 1
            }
            Write-Host "OK: $($file.Name)"
          }

      - name: Verify Windows packaging files
        shell: pwsh
        run: |
          $required = @(
            "packaging/windows/artcraft-launcher.wxs",
            "packaging/windows/artcraft-launcher.en-us.wxl",
            "packaging/windows/package.ps1",
            "packaging/windows/portable.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing Windows packaging file: $path" }
          }
          Write-Host "Windows packaging files verified."
